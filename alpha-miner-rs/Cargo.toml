[package]
name = "promenade-alpha-miner"
version = "0.2.0"
edition = "2021"
description = "Alpha Miner: event log to accepting Petri net"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
