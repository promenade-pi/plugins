[workspace]
members = ["crates/net-reduce-core"]
resolver = "2"

[package]
name = "promenade-net-reduce"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Behaviour-preserving reduction of accepting Petri nets"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
net-reduce-core = { path = "crates/net-reduce-core" }
soundness-core = { path = "../soundness-rs/crates/soundness-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
