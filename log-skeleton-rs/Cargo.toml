[workspace]
members = ["crates/log-skeleton-core"]
resolver = "2"

[package]
name = "promenade-log-skeleton"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Log skeletons: discovery and conformance (Verbeek & de Carvalho)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
log-skeleton-core = { path = "crates/log-skeleton-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
