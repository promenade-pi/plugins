[package]
name = "promenade-alignment"
version = "0.1.0"
edition = "2021"
description = "Alignment-based conformance checking: replays a log against a Petri net"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
