<!doctype html>
<meta charset="utf-8">
<title>Resource behavior view harness</title>
<style>
  html, body { margin: 0; height: 100%; }
  #root { height: 100%; }
  #bar { position: fixed; right: 8px; top: 8px; z-index: 9; font: 12px system-ui; color: #697386; }
</style>
<div id="bar">
  <select id="which"><option value="plugin">profiles</option><option value="timeline">timeline</option></select>
  <label><input type="checkbox" id="lifecycle" checked> lifecycle</label>
  <span id="status"></span>
</div>
<div id="root"></div>
<script>
  const params = new URLSearchParams(location.search);
  const which = params.get('view') || 'plugin';
  const hasLifecycle = params.get('lifecycle') !== '0';

  const PEOPLE = Array.from({ length: 14 }, (_, i) => `res-${100 + i}`);
  const ACTS = ['Review', 'Approve', 'File', 'Escalate', 'Call'];
  const BUCKETS = 60;
  let seed = 5;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;

  const profiles = PEOPLE.map((name, i) => {
    // Some people have no timed items even on a lifecycle log — the case the
    // table's null handling exists for.
    const items = hasLifecycle && i % 5 !== 3 ? 5 + Math.floor(rnd() * 200) : 0;
    const timed = items > 0;
    const events = 40 + Math.floor(rnd() * 900);
    return {
      resource: i, events, activities: 1 + Math.floor(rnd() * 5),
      cases: 10 + Math.floor(rnd() * 300), collaborators: Math.floor(rnd() * 12),
      firstMs: Date.UTC(2024, 0, 1) + rnd() * 20 * 86400000,
      lastMs: Date.UTC(2024, 2, 1) + rnd() * 20 * 86400000,
      activeDays: 5 + Math.floor(rnd() * 50),
      eventsPerActiveDay: 1 + rnd() * 25,
      topActivity: Math.floor(rnd() * ACTS.length), topActivityShare: 0.3 + rnd() * 0.7,
      spread: rnd(), batchedShare: rnd(), meanBatchSize: 1 + rnd() * 5,
      items,
      meanServiceSecs: timed ? 60 + rnd() * 40000 : null,
      medianServiceSecs: timed ? 60 + rnd() * 30000 : null,
      meanWaitSecs: timed && rnd() < 0.7 ? rnd() * 90000 : null,
      busySecs: timed ? rnd() * 900000 : null,
      workSecs: timed ? rnd() * 1200000 : null,
      utilisation: timed ? rnd() : null,
      multitaskingShare: timed ? rnd() * 0.7 : null,
      workloadSpeedR: timed && rnd() < 0.85 ? rnd() * 1.4 - 0.4 : null,
    };
  });

  const timeline = profiles.map((p) => ({
    resource: p.resource,
    // A visible shape: everybody ramps, one person leaves halfway.
    counts: Array.from({ length: BUCKETS }, (_, b) => {
      if (p.resource === 4 && b > BUCKETS / 2) return 0;
      return Math.round(Math.max(0, Math.sin((b / BUCKETS) * Math.PI) * (p.events / 40) * rnd()));
    }),
  }));

  const scatter = [];
  if (hasLifecycle) {
    for (let i = 0; i < 1500; i++) {
      const load = Math.floor(rnd() * 7);
      // Duration rises with load, with heavy spread — the effect the chart is for.
      const secs = Math.pow(10, 1.4 + load * 0.16 + rnd() * 1.6);
      scatter.push([load, secs, Math.floor(rnd() * PEOPLE.length)]);
    }
  }

  const payload = {
    resources: PEOPLE, activities: ACTS, profiles,
    bucket: 'day', bucketMs: 86400000, bucketStartMs: Date.UTC(2024, 0, 1),
    bucketCount: BUCKETS, timeline, scatter,
    stats: {
      events: profiles.reduce((s, p) => s + p.events, 0), cases: 4200,
      resources: PEOPLE.length, resourcesOmitted: 3,
      eventsWithoutResource: 210, eventsWithoutTimestamp: 4,
      hasLifecycle, itemsPaired: hasLifecycle ? 3200 : 0,
      transferredItems: hasLifecycle ? 47 : 0, unfinishedItems: hasLifecycle ? 88 : 0,
      workloadSpeedR: hasLifecycle ? 0.41 : null,
    },
  };

  const listeners = {};
  window.promenade = {
    artifact: () => ({ id: 'harness', name: 'Harness profiles', type: 'ResourceProfiles', tables: {}, value: payload }),
    theme: () => ({ bg: '#fff', text: '#1c2027', 'text-dim': '#697386', border: '#e3e6ea', accent: '#0072B2', warn: '#c80', danger: '#d33' }),
    color: () => '#7a8699',
    select: () => {}, setParams: () => {},
    sql: async () => ({ numRows: 0, columns: {} }),
    on: (ev, fn) => { (listeners[ev] ||= []).push(fn); },
    ready: () => { document.getElementById('status').textContent = ' ready'; },
  };
  window.__harness = {
    payload,
    params: (p) => (listeners.params || []).forEach((fn) => fn(p)),
    resize: (w, h) => (listeners.resize || []).forEach((fn) => fn({ w, h })),
  };

  document.getElementById('which').value = which;
  document.getElementById('lifecycle').checked = hasLifecycle;
  const reload = () => {
    location.search = `?view=${document.getElementById('which').value}`
      + `&lifecycle=${document.getElementById('lifecycle').checked ? 1 : 0}`;
  };
  document.getElementById('which').onchange = reload;
  document.getElementById('lifecycle').onchange = reload;

  const s = document.createElement('script');
  s.src = `${which}.js`;
  document.body.appendChild(s);
</script>
