[workspace]
members = ["crates/bpmn-core"]
resolver = "2"

# The wasm kernel is the workspace root package, so `wasm-pack build` and
# `package.sh` find `pkg/` exactly where the other Promenade plugins put it.
[package]
name = "promenade-bpmn"
version = "0.5.0"
edition = "2021"
description = "BPMN 2.0: convert to/from Petri nets and process trees, import BPMN XML"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bpmn-core = { path = "crates/bpmn-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
