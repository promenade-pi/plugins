[package]
name = "promenade-lpm"
version = "0.1.0"
edition = "2021"
description = "Local Process Model discovery: recurring Petri-net fragments over a subset of a log's activities"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lpm-core = { path = "crates/lpm-core" }
ocpn-core = { path = "../ocpn-rs/crates/ocpn-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
