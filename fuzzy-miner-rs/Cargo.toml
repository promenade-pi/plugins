[package]
name = "promenade-fuzzy-miner"
version = "0.1.0"
edition = "2021"
description = "Fuzzy Miner: multi-perspective metrics over a case-centric event log"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
