[workspace]
members = ["crates/station-map-core"]
resolver = "2"

[package]
name = "promenade-metro-station"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Object-Centric DFG to 3D station-map (time-depth) layout conversion"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
station-map-core = { path = "crates/station-map-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
