[workspace]
members = ["crates/playout-core"]
resolver = "2"

[package]
name = "promenade-playout"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Play-out: simulating an accepting Petri net into an event log"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
playout-core = { path = "crates/playout-core" }
soundness-core = { path = "../soundness-rs/crates/soundness-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
