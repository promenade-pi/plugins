[workspace]
members = ["crates/declare-core"]
resolver = "2"

[package]
name = "promenade-declare"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "DECLARE: declarative process models discovered from, and checked against, event logs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
declare-core = { path = "crates/declare-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
