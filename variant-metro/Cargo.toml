# Standalone workspace: the path dependency below reaches into
# plugins/metro-map's own workspace, which must not swallow this package.
[workspace]

[package]
name = "promenade-variant-metro"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Variant-attributed OC-DFG to metro-map schematic layout conversion"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The layout itself is metro-map's, reused as a library rather than forked:
# this plugin only adds the variant attribution on top of the map it builds.
metro-map-core = { path = "../metro-map/crates/metro-map-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
